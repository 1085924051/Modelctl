name: Desktop cross-platform packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop package version
        required: true
        default: "0.1.0"
  push:
    branches: [codex/go-desktop-mvp]
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  windows-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install Fyne cross compiler
        run: go install github.com/fyne-io/fyne-cross@v1.6.2
      - name: Build Windows and Linux packages
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            export MODELCTL_DESKTOP_VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_NAME" == desktop-v* ]]; then
            export MODELCTL_DESKTOP_VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            export MODELCTL_DESKTOP_VERSION="0.1.0"
          fi
          ./desktop/release-cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: modelctl-desktop-windows-linux
          path: desktop/dist/release/*
          if-no-files-found: error
          retention-days: 30
