name: Desktop self-contained runtimes

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime package version
        required: true
        default: "0.1.0"
  push:
    branches: [main, codex/go-desktop-mvp]
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node and desktop quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Validate Node sources and tests
        run: |
          node --check src/core.js
          node --check src/server.js
          node --check src/cli.js
          node --check sdk/javascript/modelctl-client.mjs
          python -m py_compile sdk/python/modelctl_client.py
          npm test
          node --test desktop/runtime/tests/*.test.mjs
      - name: Test desktop client
        working-directory: desktop
        run: go test -tags ci ./...
      - name: Vet desktop client
        working-directory: desktop
        run: go vet -tags ci ./...

  runtime-inputs:
    name: Validate runtime archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            url: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.11.17%2B20261001-aarch64-apple-darwin-install_only.tar.gz
          - target: windows-amd64
            url: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.11.17%2B20261001-x86_64-pc-windows-msvc-install_only.tar.gz
          - target: linux-amd64
            url: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.11.17%2B20261001-x86_64-unknown-linux-gnu-install_only.tar.gz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check ${{ matrix.target }} Python archive
        run: curl --fail --location --head --retry 3 --retry-all-errors --silent --show-error '${{ matrix.url }}'

  runtime:
    needs: runtime-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            requirements: macos-arm64.in
            python_archive: cpython-3.11.17+20261001-aarch64-apple-darwin-install_only.tar.gz
            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.11.17%2B20261001-aarch64-apple-darwin-install_only.tar.gz
          - os: windows-2025
            target: windows-amd64
            requirements: windows-amd64.in
            python_archive: cpython-3.11.17+20261001-x86_64-pc-windows-msvc-install_only.tar.gz
            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.11.17%2B20261001-x86_64-pc-windows-msvc-install_only.tar.gz
          - os: ubuntu-24.04
            target: linux-amd64
            requirements: linux-amd64.in
            python_archive: cpython-3.11.17+20261001-x86_64-unknown-linux-gnu-install_only.tar.gz
            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.11.17%2B20261001-x86_64-unknown-linux-gnu-install_only.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install runtime dependencies on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/${{ matrix.python_archive }} '${{ matrix.python_url }}'
          mkdir -p .runtime-python
          tar -xzf /tmp/${{ matrix.python_archive }} -C .runtime-python --strip-components=1
          .runtime-python/bin/python -m pip install --upgrade pip
          .runtime-python/bin/python -m pip install -r desktop/runtime/requirements/${{ matrix.requirements }}
      - name: Install runtime dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri '${{ matrix.python_url }}' -OutFile "$env:TEMP\${{ matrix.python_archive }}"
          New-Item -ItemType Directory -Force -Path .runtime-python | Out-Null
          tar -xzf "$env:TEMP\${{ matrix.python_archive }}" -C .runtime-python --strip-components=1
          .runtime-python\python.exe -m pip install --upgrade pip
          .runtime-python\python.exe -m pip install -r desktop/runtime/requirements/${{ matrix.requirements }}
      - name: Build runtime tree on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NODE_BINARY="$(realpath "$(command -v node)")"
          NODE_ROOT="$(cd "$(dirname "$NODE_BINARY")/.." && pwd)"
          MODELCTL_RUNTIME_TARGET="${{ matrix.target }}" \
          MODELCTL_NODE_BINARY="$NODE_BINARY" \
          MODELCTL_NODE_ROOT="$NODE_ROOT" \
          MODELCTL_PYTHON_BINARY="$PWD/.runtime-python/bin/python" \
          MODELCTL_PYTHON_ROOT="$PWD/.runtime-python" \
          MODELCTL_RUNTIME_OUTPUT="$PWD/desktop/dist/runtime/${{ matrix.target }}" \
          bash ./desktop/runtime/build-runtime.sh
      - name: Build runtime tree on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          $nodeRoot = Split-Path $node -Parent
          $env:MODELCTL_RUNTIME_TARGET = '${{ matrix.target }}'
          $env:MODELCTL_NODE_BINARY = $node
          $env:MODELCTL_NODE_ROOT = $nodeRoot
          $env:MODELCTL_PYTHON_BINARY = "$(Join-Path $env:GITHUB_WORKSPACE '.runtime-python\python.exe')"
          $env:MODELCTL_PYTHON_ROOT = "$(Join-Path $env:GITHUB_WORKSPACE '.runtime-python')"
          $runtimeOutput = Join-Path $env:GITHUB_WORKSPACE "desktop\dist\runtime\${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $runtimeOutput | Out-Null
          $env:MODELCTL_RUNTIME_OUTPUT = $runtimeOutput
          powershell -ExecutionPolicy Bypass -File desktop\runtime\build-runtime.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: modelctl-runtime-${{ matrix.target }}
          path: desktop/dist/runtime/${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Run runtime smoke test on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./desktop/tests/smoke-runtime.sh desktop/dist/runtime/${{ matrix.target }} 11435
      - name: Run runtime smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File desktop/tests/smoke-runtime.ps1 desktop/dist/runtime/${{ matrix.target }} 11435

  package-windows-linux:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install Fyne cross compiler
        run: go install github.com/fyne-io/fyne-cross@v1.6.2
      - name: Install appimagetool
        run: |
          curl -L --fail --retry 3 -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - uses: actions/download-artifact@v4
        with:
          name: modelctl-runtime-windows-amd64
          path: desktop/dist/runtime/windows-amd64
      - uses: actions/download-artifact@v4
        with:
          name: modelctl-runtime-linux-amd64
          path: desktop/dist/runtime/linux-amd64
      - name: Smoke downloaded Linux runtime
        run: |
          chmod 755 desktop/dist/runtime/linux-amd64/node/bin/node desktop/dist/runtime/linux-amd64/python/bin/python
          bash ./desktop/tests/smoke-runtime.sh desktop/dist/runtime/linux-amd64 11436
      - name: Build Windows and Linux packages
        env:
          MODELCTL_DESKTOP_VERSION: ${{ inputs.version || '0.1.0' }}
          MODELCTL_RUNTIME_ROOT: ${{ github.workspace }}/desktop/dist/runtime
        run: ./desktop/release-cross.sh
      # A single combined artifact exceeded 6 GB. Keep each download scoped
      # to the user's OS and, on Linux, to the chosen package format.
      - name: Upload Windows desktop
        uses: actions/upload-artifact@v4
        with:
          name: modelctl-desktop-windows-x64
          path: |
            desktop/dist/release/Modelctl-windows-x64-*.zip
            desktop/dist/release/SHA256SUMS
            desktop/dist/release/README.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: modelctl-desktop-linux-appimage-x86_64
          path: |
            desktop/dist/release/Modelctl-linux-x86_64-*.AppImage
            desktop/dist/release/SHA256SUMS
            desktop/dist/release/README.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Linux tar archive
        uses: actions/upload-artifact@v4
        with:
          name: modelctl-desktop-linux-tar-x86_64
          path: |
            desktop/dist/release/Modelctl-linux-x86_64-*.tar.xz
            desktop/dist/release/SHA256SUMS
            desktop/dist/release/README.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package-macos:
    needs: runtime
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: modelctl-runtime-darwin-arm64
          path: desktop/dist/runtime/macos-arm64
      - name: Smoke downloaded macOS runtime
        run: |
          chmod 755 desktop/dist/runtime/macos-arm64/node/bin/node desktop/dist/runtime/macos-arm64/python/bin/python
          bash ./desktop/tests/smoke-runtime.sh desktop/dist/runtime/macos-arm64 11436
      - name: Build macOS DMG and ZIP
        env:
          MODELCTL_DESKTOP_VERSION: ${{ inputs.version || '0.1.0' }}
          MODELCTL_RUNTIME_ROOT: ${{ github.workspace }}/desktop/dist/runtime/macos-arm64
        run: ./desktop/release-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: modelctl-desktop-macos-self-contained
          path: |
            desktop/dist/Modelctl-macOS-*.dmg
            desktop/dist/Modelctl-macOS-*.zip
            desktop/dist/Modelctl-macOS-*.sha256
          if-no-files-found: error
          retention-days: 30
